name: Build TENTEN production bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenten-bundle
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Write deploy marker
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Commit production bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist
          if git diff --cached --quiet; then
            echo "Production bundle is already current."
            exit 0
          fi
          git commit -m "chore: refresh production bundle [skip ci]"
          git push origin HEAD:main
