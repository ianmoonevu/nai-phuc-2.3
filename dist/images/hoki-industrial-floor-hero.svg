<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background & Depth Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="15%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="hokiGreenSash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006e21" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="leafVein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="skyWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <linearGradient id="steelTruss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="wallShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-10" dy="15" stdDeviation="20" flood-color="#00356a" flood-opacity="0.12" />
    </filter>

    <pattern id="laserJoints" width="120" height="80" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="120" y2="0" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.5" />
      <line x1="0" y1="0" x2="0" y2="80" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Base Wall Canvas -->
  <rect width="1920" height="1080" fill="url(#wallGrad)" />

  <!-- Architectural Background: Modern Logistics Hub & Laser-Screeded Concrete Floor (Right Side) -->
  <g id="warehouse-interior" transform="translate(850, 0)">
    <!-- High Bay Warehouse Sky Window & Parkland Outside -->
    <path d="M 120 0 L 1070 0 L 1070 520 L 0 520 Z" fill="url(#skyWindow)" />
    
    <!-- Distant Parkland Trees seen through warehouse glass facade -->
    <g opacity="0.85">
      <path d="M 120 480 Q 200 420 280 470 Q 360 410 440 460 Q 520 430 600 480 Q 700 400 800 470 Q 900 420 1000 470 L 1070 480 L 1070 520 L 120 520 Z" fill="#15803d" />
      <path d="M 160 490 Q 240 440 320 480 Q 400 430 480 470 Q 600 440 720 485 Q 840 430 960 480 L 1070 495 L 1070 520 L 160 520 Z" fill="#22c55e" opacity="0.6" />
    </g>

    <!-- Structural Steel Columns & Girders -->
    <g stroke="url(#steelTruss)" stroke-width="8" opacity="0.75">
      <line x1="200" y1="0" x2="200" y2="520" stroke-width="18" />
      <line x1="550" y1="0" x2="550" y2="520" stroke-width="22" />
      <line x1="900" y1="0" x2="900" y2="520" stroke-width="28" />
      <!-- Roof trusses -->
      <line x1="0" y1="60" x2="1070" y2="60" stroke-width="12" />
      <line x1="0" y1="140" x2="1070" y2="140" stroke-width="10" />
      <!-- Cross bracing -->
      <line x1="200" y1="60" x2="550" y2="140" stroke-width="5" />
      <line x1="200" y1="140" x2="550" y2="60" stroke-width="5" />
      <line x1="550" y1="60" x2="900" y2="140" stroke-width="6" />
      <line x1="550" y1="140" x2="900" y2="60" stroke-width="6" />
    </g>

    <!-- Polished Ultra-Flat Concrete Floor with Laser Screed Sheen (Perspective Grid) -->
    <polygon points="0,520 1070,520 1070,1080 -100,1080" fill="url(#floorGrad)" />
    
    <!-- Floor Reflection Sheen & High-Bay Light Reflections -->
    <g opacity="0.6">
      <polygon points="120,520 280,520 260,1080 60,1080" fill="#ffffff" opacity="0.25" />
      <polygon points="500,520 600,520 680,1080 540,1080" fill="#ffffff" opacity="0.35" />
      <polygon points="850,520 950,520 1070,1080 940,1080" fill="#ffffff" opacity="0.2" />
    </g>

    <!-- Jointless Concrete Slab Expansion Lines in Perspective -->
    <g stroke="#64748b" stroke-width="1.5" opacity="0.4">
      <line x1="0" y1="580" x2="1070" y2="580" />
      <line x1="-20" y1="680" x2="1070" y2="680" stroke-width="2" />
      <line x1="-50" y1="820" x2="1070" y2="820" stroke-width="2.5" />
      <line x1="-80" y1="980" x2="1070" y2="980" stroke-width="3" />
      <!-- Orthogonal Perspective Lines -->
      <line x1="200" y1="520" x2="-80" y2="1080" stroke-width="2" />
      <line x1="550" y1="520" x2="400" y2="1080" stroke-width="2.5" />
      <line x1="900" y1="520" x2="920" y2="1080" stroke-width="3" />
    </g>
  </g>

  <!-- Dynamic Curved Green Ribbon / Sustainable Bio-Sash (Matching Uploaded Option 7 & 5) -->
  <g id="green-sustainable-ribbon" filter="url(#wallShadow)">
    <!-- Primary Green Wave / Leaf Curve -->
    <path d="M 680 0 C 760 300 880 500 780 750 C 710 920 540 1080 540 1080 L 1050 1080 C 1200 900 1350 680 1200 450 C 1100 300 1050 150 1050 0 Z" fill="url(#hokiGreenSash)" opacity="0.95" />
    
    <!-- Accent Vibrant Emerald Leaf Contour -->
    <path d="M 720 0 C 800 280 910 480 820 720 C 760 880 620 1040 620 1040 L 800 1080 C 950 900 1080 680 980 420 C 920 260 890 120 890 0 Z" fill="#22c55e" opacity="0.35" />

    <!-- Organic Leaf Vein Patterns inside ribbon -->
    <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" fill="none">
      <path d="M 800 200 Q 860 350 830 500 Q 800 650 720 800" stroke-width="4" stroke-opacity="0.4" />
      <path d="M 810 280 Q 890 320 940 330" />
      <path d="M 825 360 Q 920 400 980 420" />
      <path d="M 830 440 Q 930 480 990 510" />
      <path d="M 815 520 Q 910 570 960 620" />
      <path d="M 790 600 Q 870 660 910 720" />
      <path d="M 760 680 Q 830 740 850 800" />
    </g>

    <!-- Eco City Silhouette inside the leaf banner -->
    <g fill="#ffffff" opacity="0.25" transform="translate(740, 260) scale(0.65)">
      <rect x="50" y="80" width="30" height="180" rx="3" />
      <rect x="90" y="40" width="35" height="220" rx="4" />
      <polygon points="90,40 107,15 125,40" />
      <rect x="135" y="100" width="40" height="160" rx="3" />
      <rect x="185" y="60" width="32" height="200" rx="3" />
      <rect x="225" y="120" width="38" height="140" rx="3" />
      <rect x="270" y="30" width="45" height="230" rx="4" />
      <polygon points="270,30 292,5 315,30" />
      <rect x="325" y="90" width="35" height="170" rx="3" />
    </g>
  </g>

  <!-- Left Wall Architectural Presentation Graphics (HOKI + NAI PHÚC Official Wall Display) -->
  <g id="wall-branding-elements" transform="translate(100, 70)">
    <!-- Dual Corporate Brand Lockup -->
    <g transform="translate(0, 0)">
      <!-- HOKI Vector Brand Mark -->
      <g transform="scale(1.1)">
        <polygon points="24,6 42,16 42,38 24,48 6,38 6,16" fill="none" stroke="#006e21" stroke-width="4" />
        <line x1="24" y1="6" x2="24" y2="48" stroke="#006e21" stroke-width="3" />
        <line x1="6" y1="16" x2="42" y2="38" stroke="#006e21" stroke-width="2.5" />
        <line x1="6" y1="38" x2="42" y2="16" stroke="#006e21" stroke-width="2.5" />
        <circle cx="24" cy="27" r="5" fill="#00356a" />
        <text x="56" y="34" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#00356a" letter-spacing="1">HOKI</text>
        <text x="58" y="47" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#006e21" letter-spacing="2.5">— INNOVATIVE &amp; SUSTAINABLE —</text>
      </g>

      <!-- Vertical Divider Line -->
      <line x1="310" y1="4" x2="310" y2="56" stroke="#cbd5e1" stroke-width="2" />

      <!-- NAI PHUC Brand Mark -->
      <g transform="translate(340, 4) scale(1.1)">
        <rect x="0" y="0" width="46" height="46" rx="8" fill="#006e21" />
        <text x="7" y="24" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#ffffff">NP</text>
        <text x="7" y="40" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#86efac">PP</text>
        <text x="56" y="25" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#00356a" letter-spacing="0.5">NAI PHÚC</text>
        <text x="58" y="40" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9.5" fill="#64748b" letter-spacing="1">Construction &amp; Industrial Flooring</text>
      </g>
    </g>

    <!-- Wall Graphic Headline per Option 7 in Uploaded Image -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-weight="900" font-size="46" fill="#00356a" letter-spacing="-0.5">
        SUSTAINABLE SOLUTIONS
      </text>
      <text x="0" y="55" font-family="'Montserrat', sans-serif" font-weight="900" font-size="46" fill="#006e21" letter-spacing="-0.5">
        FOR INDUSTRIAL FLOORS
      </text>
      <text x="0" y="105" font-family="'Montserrat', sans-serif" font-weight="600" font-size="18" fill="#475569" letter-spacing="1">
        Giảm phát thải  |  Tăng hiệu suất  |  Kiến tạo giá trị lâu dài
      </text>
    </g>

    <!-- 3 Engineering Value Pillars (Lower Carbon Footprint, Longer Lifespan, Resource Efficiency) -->
    <g transform="translate(0, 310)">
      <!-- Pillar 1: Lower Carbon Footprint -->
      <g transform="translate(0, 0)">
        <circle cx="28" cy="28" r="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
        <path d="M 28 14 C 20 22 18 32 28 42 C 38 32 36 22 28 14 Z" fill="none" stroke="#006e21" stroke-width="2.5" />
        <line x1="28" y1="20" x2="28" y2="38" stroke="#006e21" stroke-width="2" />
        <text x="70" y="24" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#00356a">Lower Carbon</text>
        <text x="70" y="44" font-family="'Montserrat', sans-serif" font-weight="600" font-size="13" fill="#64748b">Footprint</text>
      </g>

      <!-- Pillar 2: Longer Lifespan -->
      <g transform="translate(240, 0)">
        <circle cx="28" cy="28" r="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
        <path d="M 28 16 L 38 22 L 38 34 L 28 40 L 18 34 L 18 22 Z" fill="none" stroke="#00356a" stroke-width="2.5" />
        <path d="M 24 28 L 28 32 L 34 24" fill="none" stroke="#006e21" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="70" y="24" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#00356a">Longer</text>
        <text x="70" y="44" font-family="'Montserrat', sans-serif" font-weight="600" font-size="13" fill="#64748b">Lifespan</text>
      </g>

      <!-- Pillar 3: Resource Efficiency -->
      <g transform="translate(460, 0)">
        <circle cx="28" cy="28" r="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
        <circle cx="28" cy="28" r="14" fill="none" stroke="#006e21" stroke-width="2.5" stroke-dasharray="8 4" />
        <line x1="28" y1="8" x2="28" y2="12" stroke="#006e21" stroke-width="2.5" stroke-linecap="round" />
        <line x1="28" y1="44" x2="28" y2="48" stroke="#006e21" stroke-width="2.5" stroke-linecap="round" />
        <line x1="8" y1="28" x2="12" y2="28" stroke="#006e21" stroke-width="2.5" stroke-linecap="round" />
        <line x1="44" y1="28" x2="48" y2="28" stroke="#006e21" stroke-width="2.5" stroke-linecap="round" />
        <text x="70" y="24" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#00356a">Resource</text>
        <text x="70" y="44" font-family="'Montserrat', sans-serif" font-weight="600" font-size="13" fill="#64748b">Efficiency</text>
      </g>
    </g>
  </g>

  <!-- Ambient Cinematic Overlay Vignette (Light Engineering Style) -->
  <rect width="1920" height="1080" fill="none" stroke="#e2e8f0" stroke-width="1" />
</svg>
