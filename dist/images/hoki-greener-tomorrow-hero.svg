<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="emeraldLeafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006e21" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="skyGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <filter id="leafShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-10" dy="12" stdDeviation="16" flood-color="#00356a" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad5)" />

  <!-- Eco City Silhouette inside Leaf Window -->
  <g id="eco-city-window" transform="translate(1000, 80)" filter="url(#leafShadow)">
    <clipPath id="leafClip">
      <path d="M 0 450 C 150 150 450 0 850 0 C 850 450 650 750 300 850 C 100 850 0 700 0 450 Z" />
    </clipPath>
    
    <g clip-path="url(#leafClip)">
      <rect x="0" y="0" width="900" height="900" fill="url(#skyGrad5)" />
      
      <!-- Green Parkland Rolling Hills -->
      <path d="M 0 650 Q 250 550 500 620 Q 750 520 900 600 L 900 900 L 0 900 Z" fill="#15803d" />
      <path d="M 0 700 Q 300 620 600 690 Q 800 600 900 680 L 900 900 L 0 900 Z" fill="#22c55e" opacity="0.7" />
      
      <!-- Modern Glass High-Rises & Towers -->
      <g fill="#00356a" opacity="0.35">
        <rect x="150" y="320" width="60" height="350" rx="4" />
        <rect x="230" y="220" width="80" height="450" rx="6" />
        <polygon points="230,220 270,160 310,220" />
        <rect x="330" y="280" width="90" height="390" rx="6" />
        <rect x="440" y="180" width="100" height="490" rx="8" />
        <polygon points="440,180 490,110 540,180" />
        <rect x="560" y="260" width="80" height="410" rx="6" />
        <rect x="660" y="340" width="70" height="330" rx="4" />
      </g>
      <!-- Glass reflections -->
      <g fill="#ffffff" opacity="0.4">
        <rect x="250" y="240" width="15" height="400" />
        <rect x="465" y="200" width="20" height="440" />
      </g>
    </g>

    <!-- Leaf Frame Border -->
    <path d="M 0 450 C 150 150 450 0 850 0 C 850 450 650 750 300 850 C 100 850 0 700 0 450 Z" fill="none" stroke="url(#emeraldLeafGrad)" stroke-width="24" />
  </g>

  <!-- Sweeping Green Accent Waves -->
  <path d="M 120 1080 C 400 950 700 850 1050 920 C 1400 990 1700 920 1920 850 L 1920 1080 Z" fill="url(#emeraldLeafGrad)" opacity="0.85" />
  <path d="M 300 1080 C 600 980 900 940 1200 990 C 1500 1040 1750 990 1920 950 L 1920 1080 Z" fill="#22c55e" opacity="0.4" />

  <!-- Left Wall Branding (HOKI + NAI PHÚC) -->
  <g transform="translate(120, 100)">
    <!-- Brand Marks -->
    <g transform="scale(1.15)">
      <polygon points="24,6 42,16 42,38 24,48 6,38 6,16" fill="none" stroke="#006e21" stroke-width="4" />
      <circle cx="24" cy="27" r="5" fill="#00356a" />
      <text x="56" y="34" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#00356a">HOKI</text>
      <text x="58" y="47" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#006e21" letter-spacing="2.5">— INNOVATIVE &amp; SUSTAINABLE —</text>
      
      <line x1="280" y1="4" x2="280" y2="54" stroke="#cbd5e1" stroke-width="2" />
      
      <g transform="translate(305, 4)">
        <rect x="0" y="0" width="46" height="46" rx="8" fill="#006e21" />
        <text x="7" y="24" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#ffffff">NP</text>
        <text x="7" y="40" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#86efac">PP</text>
        <text x="56" y="25" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#00356a">NAI PHÚC</text>
        <text x="58" y="40" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9.5" fill="#64748b">Construction &amp; Industrial Flooring</text>
      </g>
    </g>

    <!-- Main Headline (Option 5) -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-weight="900" font-size="52" fill="#00356a">
        BUILDING
      </text>
      <text x="0" y="60" font-family="'Montserrat', sans-serif" font-weight="900" font-size="52" fill="#006e21">
        A GREENER TOMORROW
      </text>
      <text x="0" y="115" font-family="'Montserrat', sans-serif" font-weight="600" font-size="22" fill="#475569">
        Through Innovation and Partnership
      </text>
    </g>

    <!-- 3 Core Badges -->
    <g transform="translate(0, 360)">
      <g transform="translate(0, 0)">
        <circle cx="30" cy="30" r="30" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
        <path d="M 30 15 C 20 25 18 35 30 45 C 42 35 40 25 30 15 Z" fill="#006e21" opacity="0.8" />
        <text x="75" y="28" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#00356a">Green</text>
        <text x="75" y="48" font-family="'Montserrat', sans-serif" font-weight="600" font-size="14" fill="#64748b">Technology</text>
      </g>

      <g transform="translate(250, 0)">
        <circle cx="30" cy="30" r="30" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
        <circle cx="30" cy="30" r="16" fill="none" stroke="#00356a" stroke-width="2.5" />
        <line x1="14" y1="30" x2="46" y2="30" stroke="#00356a" stroke-width="2" />
        <ellipse cx="30" cy="30" rx="7" ry="16" fill="none" stroke="#00356a" stroke-width="2" />
        <text x="75" y="28" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#00356a">ESG</text>
        <text x="75" y="48" font-family="'Montserrat', sans-serif" font-weight="600" font-size="14" fill="#64748b">Commitment</text>
      </g>

      <g transform="translate(500, 0)">
        <circle cx="30" cy="30" r="30" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
        <circle cx="24" cy="24" r="6" fill="#006e21" />
        <circle cx="36" cy="24" r="6" fill="#006e21" />
        <circle cx="30" cy="36" r="6" fill="#006e21" />
        <text x="75" y="28" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#00356a">Sustainable</text>
        <text x="75" y="48" font-family="'Montserrat', sans-serif" font-weight="600" font-size="14" fill="#64748b">Growth</text>
      </g>
    </g>
  </g>
</svg>
